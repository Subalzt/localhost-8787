[package]
name = "localhost8787-helper"
version = "0.1.0"
edition = "2021"
description = "The Localhost 8787 laptop helper, one program for Windows, Linux and macOS"
publish = false

[[bin]]
name = "localhost8787-helper"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network"] }
open = "5"
x25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
aes = "0.8"
ctr = "0.9"
sha3 = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Media",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Media_Audio",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_Security",
    "Win32_System_Time",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[target.'cfg(not(windows))'.dependencies]
enigo = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
