<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!--
  Where your phones and laptops are (server/Where.kt), one map for the app (ui/MapScreen.kt, which
  hands it the places with setPlaces) and the page (its Map tab, which shows this in a frame; with
  ?api=1 it asks /api/where itself). The map's pictures are OpenStreetMap's (Esri's for satellite);
  the positions themselves never leave your devices.
-->
<style>
  :root {
    --bg: #FFFFFF; --sheet: rgba(255,255,255,.92); --txt: #000; --sub: #86868B; --line: rgba(60,60,67,.14); --chip: #F2F2F7;
    --blue: #007AFF; --good: #34C759; --bad: #FF3B30; --shadow: 0 10px 40px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --sheet: rgba(28,28,30,.92); --txt: #fff; --sub: #8D8D93; --line: rgba(255,255,255,.1); --chip: #2C2C2E;
      --blue: #0A84FF; --good: #30D158; --bad: #FF453A; --shadow: 0 0 0 1px rgba(255,255,255,.08), 0 18px 50px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] { --bg: #000; --sheet: rgba(28,28,30,.92); --txt: #fff; --sub: #8D8D93; --line: rgba(255,255,255,.1); --chip: #2C2C2E; --blue: #0A84FF; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Lexend", sans-serif; -webkit-font-smoothing: antialiased; }
  #map { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--chip); }
  .leaflet-control-attribution { font-size: 10px; background: var(--sheet) !important; color: var(--sub); }
  .leaflet-control-attribution a { color: var(--sub); }
  .leaflet-control-zoom { display: none; }
  /* OpenStreetMap has no dark map: in the dark, its colours turned round (water stays blue, roads light). */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .streets { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88); } }

  .pin { position: relative; width: 46px; height: 46px; }
  .pin .face { position: absolute; inset: 3px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 17px;
    border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.28); transition: transform .25s cubic-bezier(.2,.9,.25,1.2); }
  .pin.on .face { transform: scale(1.18); }
  .pin .kind { position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .pin .kind svg { width: 12px; height: 12px; fill: none; stroke: #1C1C1E; stroke-width: 2; stroke-linejoin: round; }
  .pin.stale .face { filter: grayscale(.7); opacity: .75; }
  .pin.self .face::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid currentColor; opacity: 0; animation: ping 2.4s infinite; }
  @keyframes ping { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.5); opacity: 0; } }

  .sheet { position: absolute; left: 12px; right: 12px; bottom: 12px; max-height: 46%; overflow-y: auto; border-radius: 20px; background: var(--sheet);
    backdrop-filter: saturate(1.6) blur(24px); -webkit-backdrop-filter: saturate(1.6) blur(24px); box-shadow: var(--shadow); z-index: 500; padding: 6px; }
  @media (min-width: 760px) { .sheet { left: 16px; right: auto; top: 16px; bottom: auto; width: 340px; max-height: calc(100% - 32px); } }
  .sheet h1 { font-size: 20px; font-weight: 750; letter-spacing: -.3px; margin: 10px 12px 4px; }
  .sheet .hint { margin: 0 12px 8px; font-size: 13px; color: var(--sub); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; cursor: pointer; transition: background .15s; }
  .row:hover, .row.on { background: color-mix(in srgb, var(--txt) 7%, transparent); }
  .row .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: 0 0 auto; }
  .row .who { flex: 1; min-width: 0; }
  .row b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row span { display: block; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .dist { text-align: right; font-size: 13px; color: var(--sub); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .detail { padding: 4px 12px 12px; display: none; }
  .row.on + .detail { display: block; }
  .detail .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 2px 0 10px; }
  .detail .facts dt { color: var(--sub); }
  .detail .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .detail .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 10px; background: var(--chip); color: var(--txt); font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 14px; cursor: pointer; text-decoration: none; }
  .btn.blue { background: var(--blue); color: #fff; }
  .empty { padding: 14px 12px; color: var(--sub); font-size: 13.5px; }
  .btn.red { background: var(--bad); color: #fff; }
  .row .lostchip, .lostchip { display: inline-block; width: auto; overflow: visible; margin-left: 6px; padding: 1px 7px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; vertical-align: 2px; }
  .lostform { display: none; margin-top: 10px; }
  .lostform.on { display: block; }
  .lostform input { width: 100%; margin: 0 0 8px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: var(--txt); font: inherit; font-size: 14px; }
  .said { margin-top: 8px; font-size: 12.5px; color: var(--sub); }
  .sheet h2 { font-size: 15px; font-weight: 700; margin: 14px 12px 4px; display: flex; align-items: center; }
  .sheet h2 .btn { margin-left: auto; padding: 5px 12px; font-size: 12.5px; }
  .zrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; font-size: 14px; }
  .zrow .zi { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); flex: 0 0 auto; }
  .zrow .zi svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
  .zrow b { flex: 1; font-weight: 600; } .zrow span { color: var(--sub); font-size: 12.5px; }
  .zrow button { border: 0; background: none; color: var(--bad); font: inherit; font-size: 13px; cursor: pointer; }
  .zform { margin: 4px 10px 10px; display: none; } .zform.on { display: block; }
  .zform input[type=text] { width: 100%; margin: 6px 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: var(--txt); font: inherit; font-size: 14px; }
  .zform label { font-size: 12.5px; color: var(--sub); display: flex; align-items: center; gap: 8px; }
  .zform input[type=range] { flex: 1; }
  .ztip { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 600; background: var(--sheet); padding: 8px 14px; border-radius: 12px; box-shadow: var(--shadow); font-size: 13.5px; display: none; }
  .ztip.on { display: block; }
  .fab { position: absolute; right: 14px; top: 14px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
  .fab button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--sheet); color: var(--txt); box-shadow: var(--shadow);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: grid; place-items: center; cursor: pointer; }
  .fab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="map"></div>
<div class="fab">
  <button type="button" id="fit" title="Show everything"><svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
  <button type="button" id="layer" title="Satellite"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
</div>
<div class="sheet" id="sheet"><h1>Devices</h1><p class="hint" id="hint"></p><div id="list"></div>
  <h2>Places <button class="btn" type="button" id="zadd">Mark a place</button></h2>
  <div class="zform" id="zform"><input type="text" id="zname" maxlength="40" placeholder="Name (Home, College…)">
    <label>Size <input type="range" id="zrad" min="50" max="1000" step="25" value="150"><span id="zradv">150 m</span></label>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn blue" type="button" id="zsave">Save</button><button class="btn" type="button" id="zcancel">Cancel</button></div></div>
  <div id="zlist"></div><p class="hint" style="margin-top:6px">Your phone tells you when a phone or laptop arrives at or leaves one.</p></div>
<div class="ztip" id="ztip">Tap the map where the place is</div>
<script>
var map = L.map("map", { zoomControl: false, attributionControl: true, worldCopyJump: true }).setView([20, 78], 4);
var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
var STREETS = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, className: "streets", attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' });
var SATELLITE = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Imagery &copy; Esri" });
STREETS.addTo(map);
var sat = false;
document.getElementById("layer").onclick = function () {
  sat = !sat;
  map.removeLayer(sat ? STREETS : SATELLITE); (sat ? SATELLITE : STREETS).addTo(map);
  this.title = sat ? "Streets" : "Satellite";
};

var places = [], marks = {}, circles = {}, trail = null, chosen = null, fitted = false;
var ICON = {
  phone: '<path d="M8 2.5h8A1.5 1.5 0 0 1 17.5 4v16a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 20V4A1.5 1.5 0 0 1 8 2.5Z"/>',
  laptop: '<rect x="4" y="5" width="16" height="10" rx="1.5"/><path d="M2 19h20"/>'
};
function hue(name) { var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return h; }
function face(name) { var h = hue(name); return "linear-gradient(160deg,hsl(" + h + " 70% 58%),hsl(" + ((h + 30) % 360) + " 70% 42%))"; }
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
function ago(at) {
  var s = Math.max(0, Math.round((Date.now() - at) / 1000));
  if (s < 45) return "Now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(at).toLocaleDateString([], { day: "numeric", month: "short" });
}
function metres(a, b) {
  var r = 6371000, p1 = a.lat * Math.PI / 180, p2 = b.lat * Math.PI / 180, dp = p2 - p1, dl = (b.lon - a.lon) * Math.PI / 180;
  var h = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
  return 2 * r * Math.asin(Math.min(1, Math.sqrt(h)));
}
function far(m) { return m < 1000 ? Math.round(m) + " m" : m < 10000 ? (m / 1000).toFixed(1) + " km" : Math.round(m / 1000) + " km"; }

/** The places, as the app or /api/where gives them: drawn, and listed. */
function setPlaces(list, allowed, always) {
  places = (list || []).filter(function (p) { return p.fix; });
  var hint = document.getElementById("hint");
  hint.textContent = allowed === false ? "Allow location for Localhost 8787 on the phone to show it here."
    : always === false ? "Allow location all the time on the phone, so it keeps being found with the app closed." : "";
  var seen = {};
  places.forEach(function (p) {
    seen[p.id] = true;
    var f = p.fix, ll = [f.lat, f.lon], stale = Date.now() - f.at > 15 * 60000;
    var html = '<div class="pin' + (p.self ? " self" : "") + (stale ? " stale" : "") + (chosen === p.id ? " on" : "") + '" style="color:hsl(' + hue(p.name) + ' 70% 50%)">' +
      '<div class="face" style="background:' + face(p.name) + '">' + esc(p.name.trim().charAt(0).toUpperCase()) + '</div>' +
      '<div class="kind"><svg viewBox="0 0 24 24">' + (ICON[p.kind] || ICON.phone) + '</svg></div></div>';
    var icon = L.divIcon({ html: html, className: "", iconSize: [46, 46], iconAnchor: [23, 23] });
    if (!marks[p.id]) {
      marks[p.id] = L.marker(ll, { icon: icon, zIndexOffset: p.self ? 1000 : 0 }).addTo(map).on("click", function () { choose(p.id, true); });
      circles[p.id] = L.circle(ll, { radius: f.acc, weight: 1, color: "hsl(" + hue(p.name) + " 70% 50%)", fillOpacity: .12, opacity: .5, interactive: false }).addTo(map);
    } else {
      marks[p.id].setLatLng(ll).setIcon(icon);
      circles[p.id].setLatLng(ll).setRadius(f.acc);
    }
  });
  Object.keys(marks).forEach(function (id) {
    if (!seen[id]) { map.removeLayer(marks[id]); map.removeLayer(circles[id]); delete marks[id]; delete circles[id]; }
  });
  if (!fitted && places.length) { fit(); fitted = true; }
  if (chosen) drawTrail();
  list_();
}

function fit() {
  if (!places.length) return;
  if (places.length === 1) { map.setView([places[0].fix.lat, places[0].fix.lon], 17); return; }
  map.fitBounds(L.latLngBounds(places.map(function (p) { return [p.fix.lat, p.fix.lon]; })), { padding: [70, 70], maxZoom: 17 });
}
document.getElementById("fit").onclick = function () { chosen = null; drawTrail(); list_(); fit(); };

function list_() {
  var me = places.filter(function (p) { return p.self; })[0];
  var host = document.getElementById("list");
  if (!places.length) { host.innerHTML = '<div class="empty">No positions yet. They come in as each phone and laptop reports where it is.</div>'; return; }
  host.innerHTML = places.map(function (p) {
    var f = p.fix, d = me && !p.self ? far(metres(me.fix, f)) : p.self ? "This phone" : "";
    var bat = f.battery >= 0 ? " · " + f.battery + "%" : "";
    return '<div class="row' + (chosen === p.id ? " on" : "") + '" data-id="' + esc(p.id) + '"><div class="av" style="background:' + face(p.name) + '">' +
      esc(p.name.trim().charAt(0).toUpperCase()) + '</div><div class="who"><b>' + esc(p.name) + (p.lost ? '<span class="lostchip">Lost</span>' : "") + '</b><span>' + esc(ago(f.at) + " · ±" + Math.round(f.acc) + " m" + bat +
      (p.via ? " · via " + p.via : "")) + '</span></div><div class="dist">' + esc(d) + '</div></div>' +
      '<div class="detail"><dl class="facts"><dt>Where</dt><dd>' + f.lat.toFixed(6) + ", " + f.lon.toFixed(6) + '</dd><dt>Within</dt><dd>' + Math.round(f.acc) + ' m</dd>' +
      (f.alt != null ? '<dt>Height</dt><dd>' + Math.round(f.alt) + ' m</dd>' : "") + (f.speed != null && f.speed > 0.5 ? '<dt>Moving</dt><dd>' + Math.round(f.speed * 3.6) + ' km/h</dd>' : "") +
      '<dt>Seen</dt><dd>' + esc(new Date(f.at).toLocaleString()) + '</dd><dt>From</dt><dd>' + esc(f.src || "") + '</dd></dl>' +
      '<div class="acts"><a class="btn blue" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + f.lat + "," + f.lon + '">Directions</a>' +
      '<button class="btn" type="button" data-trail="' + esc(p.id) + '">' + ((p.trail || []).length > 1 ? "Trail (" + p.trail.length + ")" : "No trail yet") + '</button>' +
      (p.kind === "phone" ? '<button class="btn" type="button" data-find="ring" data-to="' + esc(target(p)) + '">Play sound</button>' +
        (p.lost ? '<button class="btn red" type="button" data-find="found" data-to="' + esc(target(p)) + '">End lost mode</button>'
                : '<button class="btn red" type="button" data-lost="' + esc(p.id) + '">Lost mode…</button>') : "") + '</div>' +
      (p.kind === "phone" && !p.lost ? '<div class="lostform" id="lf-' + esc(p.id) + '"><input type="text" maxlength="300" placeholder="Message on its screen (it is lost; please call…)">' +
        '<input type="tel" maxlength="40" placeholder="A number to call"><button class="btn red" type="button" data-find="lost" data-to="' + esc(target(p)) + '">Turn on lost mode</button></div>' : "") +
      '<div class="said" id="said-' + esc(p.id) + '"></div></div>';
  }).join("");
  host.querySelectorAll(".row").forEach(function (r) { r.onclick = function () { choose(r.dataset.id === chosen ? null : r.dataset.id, true); }; });
  host.querySelectorAll("[data-trail]").forEach(function (b) { b.onclick = function () { showTrail = !showTrail; drawTrail(); }; });
  host.querySelectorAll("[data-lost]").forEach(function (b) { b.onclick = function () { var f = document.getElementById("lf-" + b.dataset.lost); if (f) f.classList.toggle("on"); }; });
  host.querySelectorAll("[data-find]").forEach(function (b) {
    b.onclick = function () {
      var form = b.closest(".lostform"), ins = form ? form.querySelectorAll("input") : [];
      findAct({ action: b.dataset.find, target: b.dataset.to, message: ins[0] ? ins[0].value : "", contact: ins[1] ? ins[1].value : "" }, b.closest(".detail"));
    };
  });
}

/** Who a find goes to: this phone, or the linked phone it is known through. */
function target(p) { return p.self ? "self" : (p.via || p.name); }

var findAt = null;
/** Play sound, Lost mode, End lost mode: the app's own way in it, /api/find on the page. */
function findAct(cmd, detail) {
  findAt = detail ? detail.querySelector(".said") : null;
  if (findAt) findAt.textContent = cmd.action === "ring" ? "Ringing…" : cmd.action === "lost" ? "Turning on lost mode…" : "Ending lost mode…";
  if (window.Phone && Phone.find) { Phone.find(JSON.stringify(cmd)); return; }
  fetch("/api/find", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cmd) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { findSaid(r.ok ? "" : d.message || "Could not reach it"); }); })
    .catch(function () { findSaid("Could not reach it"); });
}
function findSaid(why) { if (findAt) findAt.textContent = why ? why : "Done."; }

// ---- places: marked on the map; arriving and leaving them is said on the phone (server/Where.kt)
var zones = [], zoneLayers = [], picking = false, pick = null, pickCircle = null;
function setZones(list) {
  zones = list || [];
  zoneLayers.forEach(function (l) { map.removeLayer(l); });
  zoneLayers = [];
  zones.forEach(function (z) {
    zoneLayers.push(L.circle([z.lat, z.lon], { radius: z.radius, color: "#5E5CE6", weight: 2, dashArray: "6 6", fillOpacity: .06, interactive: false }).addTo(map));
    zoneLayers.push(L.marker([z.lat, z.lon], { interactive: false, icon: L.divIcon({ className: "", iconSize: [120, 20], iconAnchor: [60, -6],
      html: '<div style="text-align:center;font-size:12px;font-weight:700;color:#5E5CE6;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)">' + esc(z.name) + '</div>' }) }).addTo(map));
  });
  var host = document.getElementById("zlist");
  host.innerHTML = zones.length ? zones.map(function (z) {
    return '<div class="zrow"><span class="zi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="2"/></svg></span><b>' + esc(z.name) +
      '</b><span>' + Math.round(z.radius) + ' m</span><button type="button" data-unzone="' + esc(z.id) + '">Remove</button></div>';
  }).join("") : '<div class="empty" style="padding:6px 12px">None yet.</div>';
  host.querySelectorAll("[data-unzone]").forEach(function (b) { b.onclick = function () { zoneSend(null, b.dataset.unzone); }; });
}
function zoneSend(z, removeId) {
  if (window.Phone && Phone.zone) { if (z) Phone.zone(JSON.stringify(z)); else Phone.unzone(removeId); return; }
  fetch(z ? "/api/where/zone" : "/api/where/zone/delete", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(z || { key: removeId }) }).then(function () { if (window.whereLoad) whereLoad(); }).catch(function () {});
}
function zoneDone() {
  picking = false; pick = null;
  if (pickCircle) { map.removeLayer(pickCircle); pickCircle = null; }
  document.getElementById("zform").classList.remove("on");
  document.getElementById("ztip").classList.remove("on");
}
document.getElementById("zadd").onclick = function () {
  picking = true;
  document.getElementById("ztip").classList.add("on");
  document.getElementById("zform").classList.add("on");
};
document.getElementById("zrad").oninput = function () {
  document.getElementById("zradv").textContent = this.value + " m";
  if (pickCircle) pickCircle.setRadius(+this.value);
};
map.on("click", function (e) {
  if (!picking) return;
  pick = e.latlng;
  document.getElementById("ztip").classList.remove("on");
  var r = +document.getElementById("zrad").value;
  if (pickCircle) pickCircle.setLatLng(pick); else pickCircle = L.circle(pick, { radius: r, color: "#5E5CE6", weight: 2, fillOpacity: .12 }).addTo(map);
  document.getElementById("zname").focus();
});
document.getElementById("zsave").onclick = function () {
  var name = document.getElementById("zname").value.trim();
  if (!pick || !name) { document.getElementById("ztip").classList.add("on"); return; }
  zoneSend({ id: "", name: name, lat: pick.lat, lon: pick.lng, radius: +document.getElementById("zrad").value });
  document.getElementById("zname").value = "";
  zoneDone();
};
document.getElementById("zcancel").onclick = zoneDone;

var showTrail = false;
function choose(id, fly) {
  chosen = id;
  showTrail = false;
  var p = places.filter(function (x) { return x.id === id; })[0];
  if (p && fly) map.flyTo([p.fix.lat, p.fix.lon], Math.max(map.getZoom(), 17), { duration: .8 });
  setPlaces(places.length ? placesRaw : [], lastAllowed, lastAlways);
}
function drawTrail() {
  if (trail) { map.removeLayer(trail); trail = null; }
  var p = places.filter(function (x) { return x.id === chosen; })[0];
  if (!p || !showTrail || !p.trail || p.trail.length < 2) return;
  trail = L.polyline(p.trail.map(function (f) { return [f.lat, f.lon]; }), { color: "hsl(" + hue(p.name) + " 70% 50%)", weight: 4, opacity: .8, lineJoin: "round" }).addTo(map);
  map.fitBounds(trail.getBounds(), { padding: [60, 60], maxZoom: 18 });
}

var placesRaw = [], lastAllowed, lastAlways;
var setPlacesOuter = setPlaces;
setPlaces = function (list, allowed, always) { placesRaw = list || []; lastAllowed = allowed; lastAlways = always; setPlacesOuter(placesRaw, allowed, always); };

// The page: its own requests to /api/where, on each word from the page that something moved, and each 20 s.
if (/[?&]api=1/.test(location.search)) {
  var load = window.whereLoad = function () {
    fetch("/api/where", { credentials: "same-origin", cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) { setZones(d.zones); setPlaces(d.places, d.allowed, d.always); } }).catch(function () {});
  };
  load();
  setInterval(load, 20000);
  window.addEventListener("message", function (e) { if (e.data === "where") load(); });
}
setInterval(function () { if (places.length) list_(); }, 30000);
// Sized again when the window is (the app's view settling, a phone turned round, the frame shown).
window.addEventListener("resize", function () { map.invalidateSize(); });
document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(function () { map.invalidateSize(); }, 50); });
setTimeout(function () { map.invalidateSize(); if (places.length && !fitted) fit(); }, 300);
</script>
</body>
